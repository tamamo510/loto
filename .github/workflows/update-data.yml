name: Update Loto Data

on:
  schedule:
    # JST 7:00 (UTC 22:00 previous day) - after Loto7 Friday draws
    - cron: '0 22 * * 5'
    # JST 20:00 (UTC 11:00) - after Loto6 Mon/Thu draws
    - cron: '0 11 * * 1,4'
  workflow_dispatch: # Manual trigger
  # TEMP diagnostic trigger for PR #100 (remove before merge)
  push:
    branches: [ccr-c4156200-8xvr68]
    paths: ['.github/workflows/update-data.yml']

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # TEMP diagnostic step for PR #100 (remove before merge). Read-only: nothing here is used as data.
      - name: Diagnose data source (temporary)
        continue-on-error: true
        run: |
          for h in sougaku.com www.sougaku.com; do
            echo "=== $h ==="
            getent hosts "$h" || echo "DNS: no answer"
            echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || echo "TLS: no certificate"
            curl -sS -o /dev/null -w "https verified: HTTP %{http_code} -> %{redirect_url}\n" --max-time 20 "https://$h/loto6/data/detail/" || true
            curl -sSk --max-time 20 "https://$h/loto6/data/detail/" | grep -o '<title>[^<]*</title>' | head -1 || true
            curl -sS -o /dev/null -w "http: HTTP %{http_code} -> %{redirect_url}\n" --max-time 20 "http://$h/loto6/data/detail/" || true
          done

      # Exits 1 when data.js could not be brought fully up to date. The rounds that
      # did succeed are still committed below; the last step then marks the run red.
      - name: Fetch latest data from sougaku.com
        id: fetch
        run: python scripts/update_data.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update loto data from sougaku.com"
            git push
          fi

      - name: Fail if data is still out of date
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Data fetch failed. See the 'Fetch latest data from sougaku.com' step log."
          exit 1
