name: Cleanup stale claude branches

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete all claude/ branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --prune origin
          for branch in $(git branch -r | grep 'origin/claude/' | sed 's|origin/||'); do
            echo "Deleting $branch"
            git push origin --delete "$branch" || true
          done
      - name: Self-cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-branches.yml
          git commit -m "Remove cleanup workflow after use"
          git push
