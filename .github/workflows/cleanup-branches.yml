name: Cleanup stale claude branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete all claude/ branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for branch in $(git branch -r | grep 'origin/claude/' | sed 's|  origin/||'); do
            echo "Deleting $branch"
            git push origin --delete "$branch" || true
          done
      - name: Self-cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git rm .github/workflows/cleanup-branches.yml
          git commit -m "Remove cleanup workflow after use"
          git push
